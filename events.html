<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Campus Life Super App - Events</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- Your CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Campus Life App</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="dining.html">Dining</a></li>
                    <li class="nav-item"><a class="nav-link" href="map.html">Map</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="bg-light py-4">
        <div class="container">
            <h1 class="fw-bold">Campus Events</h1>
            <p class="lead">Browse upcoming events and activities on campus.</p>
        </div>
    </header>

    <!-- Events List -->
    <main class="container my-4">
        <!-- Filter section -->
<section class="mb-4">
    <h2 class="h4">Filter Events</h2>
    <div class="row g-2">
        <div class="col-sm-6 col-md-4">
            <select id="eventCategoryFilter" class="form-select" aria-label="Select event category"> 
                <option value="all">All Categories</option>
                <option value="academic">Academic</option>
                <option value="social">Social</option>
                <option value="sports">Sports</option>
                <option value="club">Clubs & Orgs</option>
            </select>
        </div>
        <div class="col-sm-6 col-md-4">
            <button id="applyEventFilter" class="btn btn-primary w-100">
                Apply Filter
            </button>
        </div>
    </div>
</section>

<section id="eventsList" class="row g-4">
    <!-- JS will insert cards here -->
</section>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Your JS -->
    <script src="js/script.js"></script>
